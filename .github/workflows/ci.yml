# fmt, clippy -D warnings, cargo deny and the tests, on Linux, macOS and
# Windows. The toolchain comes from rust-toolchain.toml.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # aws-lc-sys (rustls's crypto) needs NASM on Windows x86_64 unless it
      # uses its prebuilt objects; elsewhere this changes nothing.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148,cargo-deny@0.20.2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: clippy (rig)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo deny
        run: cargo deny --log-level error check

      - name: tests
        run: cargo nextest run --locked

      - name: tests (rig)
        run: cargo nextest run --all-features --locked

  # The Topcoat example is its own package on Rust 1.99, so the library's
  # toolchain, lockfile and cargo deny never see Topcoat.
  web-example:
    name: web example
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: examples/web
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain from examples/web/rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: examples/web

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked -- -D warnings
