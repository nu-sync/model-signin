[package]
name = "model-signin-web"
description = "Both sign-ins and a rig call from a browser, on Topcoat."
version = "0.1.0"
edition = "2024"
license = "MIT"
# Topcoat 0.11 needs Rust 1.99; the library stays on 1.97.1. This package's
# own rust-toolchain.toml and Cargo.lock keep the two apart.
rust-version = "1.99"
publish = false

# Its own workspace, so the library's builds, lockfile and `cargo deny`
# never see Topcoat.
[workspace]

[dependencies]
# StreamExt, to read rig's streamed reply.
futures-util = "0.3.32"
model-signin = { path = "../..", features = ["rig"] }
# The model calls go through rig's own reqwest transport.
rig-core = { version = "=0.45.0", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }
topcoat = "0.11.0"

[lints.rust]
unsafe_code = "forbid"
